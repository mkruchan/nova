<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>

<!-- PWA / "Add to Home Screen" support for iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="theme-color" content="#0A0D18">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E1220'/%3E%3Ctext x='50' y='68' font-size='56' font-family='sans-serif' font-weight='800' fill='%235B8CFF' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Nova","short_name":"Nova","start_url":".","display":"standalone","background_color":"%230A0D18","theme_color":"%230A0D18"}'>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0A0D18; --window:#0E1220; --panel:#141A2E; --panel-2:#182035;
    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12);
    --blue:#5B8CFF; --blue-light:#9DB8FF; --blue-dim:#2A3A66;
    --green:#34D399; --rose:#FB7185; --white:#F3F5FC; --muted:#8993B5; --muted-dim:#5C6485;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:#050710; font-family:'Inter', sans-serif; color:var(--white);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }

  svg.icon{ width:16px; height:16px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Loading / Auth screens ---------- */
  .center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:24px; text-align:center; }
  .brand-lockup{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .brand-mark-lg{ width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--blue), #7CA9FF); display:flex; align-items:center; justify-content:center; font-family:'Sora', sans-serif; font-weight:800; font-size:20px; color:#0A0D18; }
  .brand-name-lg{ font-family:'Sora', sans-serif; font-weight:700; font-size:26px; }
  .center-screen p{ color:var(--muted); font-size:13.5px; max-width:380px; line-height:1.6; }
  .auth-input{ background:var(--panel); border:1px solid var(--border-2); color:var(--white); border-radius:10px; padding:11px 14px; font-size:14px; width:280px; max-width:80vw; outline:none; }
  .auth-input:focus{ border-color:var(--blue); }
  .btn-primary{ background:var(--blue); color:#0A0D18; border:none; border-radius:10px; padding:11px 18px; font-size:13.5px; font-weight:600; }
  .btn-primary:disabled{ opacity:0.5; }
  .btn-secondary{ background:var(--panel-2); color:var(--muted); border:1px solid var(--border-2); border-radius:10px; padding:9px 16px; font-size:12.5px; }
  .setup-box{ background:var(--panel); border:1px solid var(--border-2); border-radius:12px; padding:20px 24px; max-width:480px; text-align:left; font-size:12.5px; color:var(--muted); line-height:1.7; }
  .setup-box code{ background:var(--panel-2); padding:2px 6px; border-radius:5px; color:var(--blue-light); font-size:11.5px; }
  .setup-box b{ color:var(--white); }
  .status-msg{ font-size:12.5px; color:var(--green); }
  .status-msg.error{ color:var(--rose); }

  /* ---------- App shell ---------- */
  #app{ display:none; height:100vh; background:var(--window); }
  #app.visible{ display:flex; }

  .sidebar{ width:224px; background:var(--panel); border-right:1px solid var(--border); padding:20px 14px; flex-shrink:0; display:none; flex-direction:column; }
  .brand{ display:flex; align-items:center; gap:8px; margin:2px 4px 18px; }
  .brand-mark{ width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg, var(--blue), #7CA9FF); display:flex; align-items:center; justify-content:center; font-family:'Sora', sans-serif; font-weight:800; font-size:12px; color:#0A0D18; }
  .brand-name{ font-family:'Sora', sans-serif; font-weight:700; font-size:17px; }

  .side-label{ font-family:'Sora', sans-serif; font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted-dim); margin:14px 8px 8px; }
  .side-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:7px; font-size:13px; color:var(--muted); margin-bottom:2px; border:none; background:none; width:100%; text-align:left; }
  .side-item.active{ background:rgba(91,140,255,0.14); color:var(--white); }
  .side-item .tag{ font-size:9.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted-dim); background:rgba(255,255,255,0.05); padding:2px 6px; border-radius:5px; }
  .si-left{ display:flex; align-items:center; gap:10px; }
  .side-item.active .si-left svg.icon{ color:var(--blue-light); }
  .side-footer{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
  .side-footer button{ background:none; border:none; color:var(--muted-dim); font-size:11.5px; padding:6px 10px; }

  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--window); }
  .main{ flex:1; padding:24px 28px; overflow-y:auto; position:relative; background:var(--window); }
  .main-dim{ position:fixed; inset:0; background:rgba(5,7,16,0); pointer-events:none; transition:background 0.4s ease; z-index:15; }
  .main-dim.on{ background:rgba(5,7,16,0.55); }

  .main-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .main-title{ font-family:'Sora', sans-serif; font-weight:700; font-size:19px; }
  .main-title span{ color:var(--muted); font-weight:500; }
  .live-badge{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
  .header-btn{ background:var(--panel-2); border:1px solid var(--border-2); color:var(--muted); border-radius:7px; padding:6px 12px; font-size:11.5px; font-weight:600; }
  .header-btn:hover{ color:var(--white); border-color:var(--blue); }
  .live-dot{ display:inline-flex; align-items:center; gap:5px; color:var(--green); font-weight:600; }
  .live-dot::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }

  /* Ask Nova bar */
  .ask-nova{ position:relative; z-index:10; display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border-2); border-radius:12px; padding:12px 16px; margin-bottom:18px; transition:box-shadow 0.3s ease, border-color 0.3s ease; cursor:default; }
  .ask-nova[data-state="listening"], .ask-nova[data-state="speaking"]{ border-color:rgba(91,140,255,0.4); box-shadow:0 0 0 3px rgba(91,140,255,0.12), 0 0 24px rgba(91,140,255,0.15); }
  .orb-wrap{ position:relative; width:24px; height:24px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .orb{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 35%, var(--blue-light), var(--blue)); box-shadow:0 0 14px rgba(91,140,255,0.55); transition:box-shadow 0.3s ease, transform 0.3s ease; z-index:2; }
  [data-state="listening"] .orb, [data-state="speaking"] .orb{ box-shadow:0 0 22px rgba(91,140,255,0.9); transform:scale(1.06); }
  [data-state="thinking"] .orb{ animation:think-spin 1.1s linear infinite; }
  @keyframes think-spin{ 0%{filter:brightness(1);} 50%{filter:brightness(1.5);} 100%{filter:brightness(1);} }
  .pulse-ring{ position:absolute; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--blue-light); opacity:0; z-index:1; }
  [data-state="listening"] .pulse-ring, [data-state="speaking"] .pulse-ring{ animation:pulse-out 1.6s ease-out infinite; }
  .pulse-ring.r2{ animation-delay:0.55s !important; }
  @keyframes pulse-out{ 0%{width:22px;height:22px;opacity:0.55;} 100%{width:50px;height:50px;opacity:0;} }
  .ask-nova-body{ flex:1; min-width:0; }
  .ph{ font-size:13px; color:var(--muted); }
  .ph.shimmer{ background:linear-gradient(90deg, var(--muted) 0%, var(--white) 50%, var(--muted) 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 1.4s linear infinite; }
  @keyframes shimmer{ to{ background-position:-200% center; } }

  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .stat-label{ font-size:12px; color:var(--muted); margin-bottom:10px; }
  .stat-num{ font-family:'Sora', sans-serif; font-weight:700; font-size:23px; margin-bottom:8px; }
  .stat-delta{ font-size:12px; font-weight:600; color:var(--muted-dim); }

  .charts-row{ display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:18px; }
  .chart-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .chart-title{ font-family:'Sora', sans-serif; font-weight:700; font-size:14px; margin-bottom:12px; }
  .chart-legend{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .legend-chip{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); background:var(--panel-2); border-radius:6px; padding:4px 8px; }
  .legend-swatch{ width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .donut-wrap{ display:flex; align-items:center; justify-content:center; }
  .empty-note{ font-size:12px; color:var(--muted-dim); text-align:center; padding:12px 0; }

  .chart-title-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .filter-row{ display:flex; gap:8px; }
  .filter-select{ background:var(--panel-2); border:1px solid var(--border-2); color:var(--muted); border-radius:7px; padding:6px 9px; font-size:11.5px; outline:none; }
  .filter-select:focus{ border-color:var(--blue); }
  .breakdown-total-label{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .breakdown-total{ font-family:'Sora', sans-serif; font-weight:700; font-size:26px; margin-bottom:14px; }
  .breakdown-body{ display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  .breakdown-body .donut-wrap{ flex-shrink:0; }
  .cat-list{ flex:1; min-width:220px; }
  .cat-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .cat-row:last-child{ border-bottom:none; }
  .cat-swatch{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .cat-name{ flex:1; color:var(--white); }
  .cat-pct{ color:var(--muted-dim); width:38px; text-align:right; font-variant-numeric:tabular-nums; }
  .cat-amt{ width:90px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width: 760px){
    .breakdown-body{ flex-direction:column; align-items:center; }
    .cat-list{ width:100%; }
  }

  .clickable-card{ cursor:pointer; transition:border-color 0.15s ease; }
  .clickable-card:hover{ border-color:var(--blue-dim); }
  .chevron{ color:var(--muted-dim); font-size:16px; flex-shrink:0; }
  .clickable-row{ cursor:pointer; }
  .clickable-row:hover .cat-name{ color:var(--blue-light); }

  .donut-wrap-mini{ position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .donut-center-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .donut-total-sub{ font-size:10.5px; color:var(--muted); margin-bottom:4px; }
  .donut-total{ font-family:'Sora', sans-serif; font-weight:700; font-size:19px; }

  .detail-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .back-btn{ width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--border-2); color:var(--white); font-size:18px; display:flex; align-items:center; justify-content:center; }
  .detail-title{ font-family:'Sora', sans-serif; font-weight:700; font-size:17px; }
  .detail-filters{ margin-bottom:20px; }
  .detail-donut-row{ display:flex; justify-content:center; margin-bottom:20px; }

  .month-bars-row{ display:flex; align-items:flex-end; gap:6px; height:80px; margin-bottom:20px; padding:0 2px; }
  .month-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .month-bar{ width:100%; max-width:26px; background:var(--panel-2); border-radius:4px 4px 2px 2px; }
  .month-bar.current{ background:var(--blue); }
  .month-bar-label{ font-size:9.5px; color:var(--muted-dim); }
  .month-bar-label.current{ color:var(--white); font-weight:600; }

  .cat-list-full{ margin-top:4px; }
  .cat-row.total-row{ font-weight:700; color:var(--white); border-bottom:1px solid var(--border-2); padding-bottom:12px; margin-bottom:4px; }

  /* Budget */
  .budget-bar{ width:100%; height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden; margin:8px 0; }
  .budget-bar-fill{ height:100%; background:var(--blue); border-radius:5px; transition:width 0.3s ease; }
  .budget-bar-fill.over{ background:var(--rose); }
  .budget-headline{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
  .budget-headline-num{ font-family:'Sora', sans-serif; font-weight:700; font-size:22px; color:var(--white); }
  .budget-headline-num.over{ color:var(--rose); }
  .budget-headline-sub{ font-size:12.5px; color:var(--muted); }
  .budget-headline-target{ margin-left:auto; font-size:11.5px; color:var(--muted-dim); font-variant-numeric:tabular-nums; }
  .budget-warning{ display:flex; align-items:center; gap:6px; font-size:12px; color:#F5A623; margin-top:8px; }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:16px; }
  .month-nav-btn{ background:none; border:none; color:var(--muted); font-size:18px; padding:4px 10px; }
  .month-nav-btn:hover{ color:var(--white); }
  .month-nav-label{ font-family:'Sora', sans-serif; font-weight:700; font-size:15px; min-width:140px; text-align:center; }

  .budget-total-row{ margin-bottom:16px; }
  .budget-total-head{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--white); margin-bottom:4px; }
  .budget-total-head span:first-child{ color:var(--muted); }

  .budget-cat-row{ margin-bottom:16px; }
  .budget-cat-head{ display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  .budget-cat-name{ flex:1; font-size:12.5px; color:var(--white); }
  .budget-cat-amt{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .budget-cat-status{ font-size:11px; color:var(--muted-dim); }
  .budget-cat-status.over{ color:var(--rose); }

  .budget-edit-row input{ text-align:right; }

  .bottom-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .panel-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .panel-title h3{ font-family:'Sora', sans-serif; font-weight:700; font-size:13.5px; margin:0; }
  .add-btn{ background:var(--blue-dim); color:var(--blue-light); border:none; border-radius:7px; padding:5px 10px; font-size:11px; font-weight:600; }

  .tx-row{ display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--border); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-icon{ width:28px; height:28px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
  .tx-icon svg.icon{ width:14px; height:14px; }
  .tx-info{ flex:1; min-width:0; }
  .tx-name{ font-size:12.5px; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta{ font-size:10.5px; color:var(--muted-dim); }
  .tx-amt{ font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tx-amt.neg{ color:var(--white); } .tx-amt.pos{ color:var(--green); }
  .tx-del{ background:none; border:none; color:var(--muted-dim); font-size:14px; padding:2px 6px; opacity:0; transition:opacity .15s; }
  .tx-row:hover .tx-del{ opacity:1; }

  .account-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .account-row:last-child{ border-bottom:none; }
  .account-name{ color:var(--white); }
  .account-type{ font-size:10.5px; color:var(--muted-dim); }
  .account-bal{ font-variant-numeric:tabular-nums; font-weight:600; }

  /* Placeholder module screens */
  .placeholder-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px; color:var(--muted); }
  .placeholder-screen svg.icon{ width:38px; height:38px; color:var(--blue-dim); margin-bottom:14px; }
  .placeholder-screen h2{ font-family:'Sora', sans-serif; color:var(--white); font-size:18px; margin:0 0 8px; }
  .placeholder-screen p{ font-size:13px; max-width:320px; line-height:1.6; }

  /* Modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(5,7,16,0.7); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--border-2); border-radius:14px; padding:22px 24px; width:360px; max-width:100%; }
  .modal h3{ font-family:'Sora', sans-serif; margin:0 0 16px; font-size:16px; }
  .form-row{ margin-bottom:12px; }
  .form-row label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; }
  .form-row input, .form-row select{ width:100%; background:var(--panel-2); border:1px solid var(--border-2); color:var(--white); border-radius:8px; padding:9px 11px; font-size:13px; outline:none; }
  .form-row input:focus, .form-row select:focus{ border-color:var(--blue); }
  .type-toggle{ display:flex; gap:6px; }
  .type-btn{ flex:1; background:var(--panel-2); border:1px solid var(--border-2); color:var(--muted); border-radius:8px; padding:9px 0; font-size:12.5px; font-weight:600; }
  .type-btn.active{ background:var(--blue); color:#0A0D18; border-color:transparent; }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; justify-content:flex-end; }
  .modal-actions button{ border:none; border-radius:8px; padding:9px 16px; font-size:12.5px; font-weight:600; }
  .modal-cancel{ background:var(--panel-2); color:var(--muted); }
  .modal-save{ background:var(--blue); color:#0A0D18; }

  /* ---------- Mobile layout ---------- */
  .tabbar{ display:none; justify-content:space-around; align-items:center; padding:10px 0 calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--border-2); background:var(--panel); flex-shrink:0; }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; color:var(--muted-dim); background:none; border:none; }
  .tab .ic{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
  .tab.active{ color:var(--blue-light); }
  .tab.active .ic{ background:rgba(91,140,255,0.14); }

  @media (max-width: 760px){
    .sidebar{ display:none !important; }
    .tabbar{ display:flex; }
    .stats-row{ grid-template-columns:repeat(2,1fr); }
    .charts-row{ grid-template-columns:1fr; }
    .bottom-row{ grid-template-columns:1fr; }
    .main{ padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  }
  @media (min-width: 761px){
    .sidebar{ display:flex !important; }
  }
</style>
</head>
<body>

<!-- Icon sprite -->
<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <defs>
    <symbol id="ic-wallet" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></symbol>

const EXPENSE_CATEGORIES = [
  "Education","Travel","Home","Health","Rent","Bills","Family care","Kitsterovna",
  "Transport","Scooter","Gifts","Charity","Groceries","Eating out","Entertainment","Electronics",
  "Digital / Subscriptions","Clothing","Active Leisure","Entrepreneurship","Investments","Flowers",
  "Smoking","Self-care","Music & Video","Sport","Services","Fees","Taxes","Other expense","Refund"
];
const INCOME_CATEGORIES = ["Salary","Freelance","Sale","Gifts","Other income","Cashback","Business","Refund"];

const DONUT_COLORS = ['#5B8CFF', '#8FB2FF', '#C3D3FF', '#2A3A66', '#4A5A8A', '#7A8CC9'];

let currentUser = { id: 'local' };
let transactions = [];
let currentView = 'finance';
let nextId = 1;

function loadData(){
  try{
    const saved = localStorage.getItem('nova-transactions');
    transactions = saved ? JSON.parse(saved) : [];
  }catch(e){
    transactions = [];
  }
  const maxId = transactions.reduce(function(m,t){
    const n = parseInt(String(t.id).replace(/\D/g,''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  nextId = maxId + 1;
}

function persist(){
  localStorage.setItem('nova-transactions', JSON.stringify(transactions));
}

function init(){
  document.getElementById('app').classList.add('visible');
  loadData();
  loadBudgets();
  renderView('finance');
}

/* ---------- Navigation ---------- */
document.querySelectorAll('[data-view]').forEach(function(el){
  el.addEventListener('click', function(){ renderView(this.getAttribute('data-view')); });
});

function setActiveNav(view){
  document.querySelectorAll('[data-view]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-view') === view);
  });
}

function renderView(view){
  currentView = view;
  setActiveNav(view);
  const main = document.getElementById('mainContent');
  if(view === 'finance'){
    main.innerHTML = financeHTML();
    wireFinanceEvents();
  } else {
    const meta = {
      diet:  { icon:'ic-utensils', label:'Diet' },
      sport: { icon:'ic-dumbbell', label:'Sport' },
      sleep: { icon:'ic-moon', label:'Sleep' },
      tasks: { icon:'ic-check-square', label:'Tasks' }
    }[view];
    main.innerHTML = `
      <div class="placeholder-screen">
        <svg class="icon"><use href="#${meta.icon}"/></svg>
        <h2>${meta.label} isn't built yet</h2>
        <p>This module is next up. Ask Nova will work the same way here once it's live — same bar, same voice, new data underneath.</p>
      </div>`;
  }
}

/* ---------- Finance calculations ---------- */
function thisMonthTx(){
  const now = new Date();
  return transactions.filter(function(t){
    const d = new Date(t.occurred_at);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
}

function netWorth(){
  return transactions.reduce(function(sum, t){ return sum + Number(t.amount); }, 0);
}

function monthIncome(){
  return thisMonthTx().filter(function(t){ return Number(t.amount) > 0; })
    .reduce(function(s,t){ return s + Number(t.amount); }, 0);
}
function monthSpend(){
  return thisMonthTx().filter(function(t){ return Number(t.amount) < 0; })
    .reduce(function(s,t){ return s + Math.abs(Number(t.amount)); }, 0);
}
function savingsRate(){
  const inc = monthIncome();
  if(inc <= 0) return null;
  return Math.round(((inc - monthSpend()) / inc) * 100);
}
function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtShort(n){
  return (n<0?'-':'') + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

let breakdownPeriod = 'month';
let breakdownCategory = 'all';

function expensesForPeriod(period){
  const now = new Date();
  return transactions.filter(function(t){
    if(Number(t.amount) >= 0) return false;
    const d = new Date(t.occurred_at);
    if(period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    if(period === 'year') return d.getFullYear() === now.getFullYear();
    return true; // all time
  });
}

function periodLabel(period){
  const now = new Date();
  if(period === 'month') return now.toLocaleString(undefined, { month:'long', year:'numeric' });
  if(period === 'year') return String(now.getFullYear());
  return 'All time';
}

function categoryBreakdown(txList){
  const byCat = {};
  txList.forEach(function(t){
    byCat[t.category] = (byCat[t.category] || 0) + Math.abs(Number(t.amount));
  });
  return Object.entries(byCat).sort(function(a,b){ return b[1]-a[1]; });
}

function donutSVG(data){
  const total = data.reduce(function(s,d){ return s + d[1]; }, 0);
  if(total === 0) return null;
  const r = 70, c = 2*Math.PI*r;
  let cum = 0;
  const arcs = data.map(function(d, i){
    const frac = d[1] / total;
    const dash = (frac * c).toFixed(2) + ' ' + (c - frac*c).toFixed(2);
    const rotate = -90 + cum * 360;
    cum += frac;
    return `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}" stroke-width="26" stroke-dasharray="${dash}" transform="rotate(${rotate.toFixed(1)} 100 100)"/>`;
  }).join('');
  return `<svg width="150" height="150" viewBox="0 0 200 200"><circle cx="100" cy="100" r="70" fill="none" stroke="var(--panel-2)" stroke-width="26"/>${arcs}</svg>`;
}

let financeSubView = null; // null | 'expense' | 'budget'

function monthlyExpenseBarsHTML(){
  const now = new Date();
  const months = [];
  for(let i = 8; i >= 0; i--){
    months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  }
  const sums = months.map(function(m){
    return transactions.filter(function(t){
      const d = new Date(t.occurred_at);
      return Number(t.amount) < 0 && d.getFullYear() === m.getFullYear() && d.getMonth() === m.getMonth();
    }).reduce(function(s,t){ return s + Math.abs(Number(t.amount)); }, 0);
  });
  const max = Math.max.apply(null, sums.concat([1]));
  const bars = months.map(function(m,i){
    const h = Math.max(4, Math.round((sums[i]/max) * 56));
    const isCurrent = m.getFullYear() === now.getFullYear() && m.getMonth() === now.getMonth();
    return `<div class="month-bar-col">
      <div class="month-bar${isCurrent?' current':''}" style="height:${h}px;"></div>
      <div class="month-bar-label${isCurrent?' current':''}">${m.toLocaleString(undefined,{month:'short'})}</div>
    </div>`;
  }).join('');
  return `<div class="month-bars-row">${bars}</div>`;
}

function donutWithCenterLabel(svg, total, sublabel){
  if(!svg) return '<div class="empty-note">No expenses in this period.</div>';
  return `<div class="donut-wrap-mini">${svg}
    <div class="donut-center-label">
      <div class="donut-total-sub">${sublabel}</div>
      <div class="donut-total">${fmtShort(-total)}</div>
    </div>
  </div>`;
}

// Compact clickable card shown on the main dashboard
function expenseCategorySummaryHTML(){
  const periodTx = expensesForPeriod('month');
  const data = categoryBreakdown(periodTx);
  const total = data.reduce(function(s,d){ return s + d[1]; }, 0);
  const svg = donutSVG(data);
  const top = data.slice(0,4);
  const rest = data.slice(4);
  const restTotal = rest.reduce(function(s,d){ return s + d[1]; }, 0);

  const rows = top.map(function(d,i){
    const pct = total ? Math.round((d[1]/total)*100) : 0;
    return `<div class="cat-row">
      <span class="cat-swatch" style="background:${DONUT_COLORS[i % DONUT_COLORS.length]}"></span>
      <span class="cat-name">${d[0]}</span>
      <span class="cat-pct">${pct}%</span>
      <span class="cat-amt">${fmt(-d[1])}</span>
    </div>`;
  }).join('');
  const moreRow = rest.length ? `<div class="cat-row">
      <span class="cat-swatch" style="background:var(--muted-dim)"></span>
      <span class="cat-name">${rest.length} more</span>
      <span class="cat-amt">${fmt(-restTotal)}</span>
    </div>` : '';

  return `
    <div class="chart-card clickable-card" style="grid-column:1 / -1;" onclick="openExpenseDetail()">
      <div class="chart-title-row">
        <div class="chart-title">Top Expense Categories, ${periodLabel('month')}</div>
        <span class="chevron">›</span>
      </div>
      <div class="breakdown-body">
        ${donutWithCenterLabel(svg, total, 'Total expenses')}
        <div class="cat-list">${data.length ? rows + moreRow : '<div class="empty-note">No expenses logged this month yet.</div>'}</div>
      </div>
    </div>`;
}

// Full-screen detail view, opened by tapping the summary card
function expenseDetailScreenHTML(){
  const periodTx = expensesForPeriod(breakdownPeriod);
  const filteredTx = breakdownCategory === 'all' ? periodTx : periodTx.filter(function(t){ return t.category === breakdownCategory; });
  const data = categoryBreakdown(filteredTx);
  const total = data.reduce(function(s,d){ return s + d[1]; }, 0);
  const svg = donutSVG(data);

  const catOptions = ['<option value="all">All categories</option>'].concat(
    EXPENSE_CATEGORIES.map(function(c){ return `<option value="${c}"${breakdownCategory===c?' selected':''}>${c}</option>`; })
  ).join('');

  const rows = data.length ? data.map(function(d,i){
    const pct = total ? Math.round((d[1]/total)*100) : 0;
    return `<div class="cat-row clickable-row" onclick="setBreakdownCategory('${d[0]}')">
      <span class="cat-swatch" style="background:${DONUT_COLORS[i % DONUT_COLORS.length]}"></span>
      <span class="cat-name">${d[0]}</span>
      <span class="cat-pct">${pct}%</span>
      <span class="cat-amt">${fmt(-d[1])}</span>
      <span class="chevron">›</span>
    </div>`;
  }).join('') : '<div class="empty-note">No expenses in this period.</div>';

  return `
    <div class="detail-header">
      <button class="back-btn" onclick="closeExpenseDetail()">‹</button>
      <div class="detail-title">Expenses by category</div>
      <div style="width:32px;"></div>
    </div>

    <div class="filter-row detail-filters">
      <select class="filter-select" onchange="setBreakdownPeriod(this.value)">
        <option value="month"${breakdownPeriod==='month'?' selected':''}>Monthly</option>
        <option value="year"${breakdownPeriod==='year'?' selected':''}>Yearly</option>
        <option value="all"${breakdownPeriod==='all'?' selected':''}>All time</option>
      </select>
      <select class="filter-select" onchange="setBreakdownCategory(this.value)">${catOptions}</select>
    </div>

    <div class="detail-donut-row">
      ${donutWithCenterLabel(svg, total, periodLabel(breakdownPeriod))}
    </div>

    ${monthlyExpenseBarsHTML()}

    <div class="cat-list-full">
      <div class="cat-row total-row">
        <span class="cat-name">Total expenses</span>
        <span class="cat-amt">${fmt(-total)}</span>
      </div>
      ${rows}
    </div>
  `;
}

window.setBreakdownPeriod = function(v){ breakdownPeriod = v; renderView('finance'); };
window.setBreakdownCategory = function(v){ breakdownCategory = v; financeSubView = 'expense'; renderView('finance'); };
window.openExpenseDetail = function(){ financeSubView = 'expense'; renderView('finance'); };
window.closeExpenseDetail = function(){ financeSubView = null; renderView('finance'); };

/* ---------- Budgets ---------- */
let budgets = { categoryBudgets: {}, incomeTarget: 0 };
let budgetViewMonth = new Date(); budgetViewMonth.setDate(1);

function loadBudgets(){
  try{
    const saved = localStorage.getItem('nova-budgets');
    if(saved) budgets = JSON.parse(saved);
  }catch(e){ /* keep defaults */ }
  if(!budgets.categoryBudgets) budgets.categoryBudgets = {};
  if(!budgets.incomeTarget) budgets.incomeTarget = 0;
}
function persistBudgets(){ localStorage.setItem('nova-budgets', JSON.stringify(budgets)); }

function totalExpenseBudget(){
  return Object.values(budgets.categoryBudgets).reduce(function(s,v){ return s + Number(v||0); }, 0);
}

function txForMonth(date){
  return transactions.filter(function(t){
    const d = new Date(t.occurred_at);
    return d.getFullYear() === date.getFullYear() && d.getMonth() === date.getMonth();
  });
}
function monthSpendFor(date){
  return txForMonth(date).filter(function(t){ return Number(t.amount) < 0; })
    .reduce(function(s,t){ return s + Math.abs(Number(t.amount)); }, 0);
}
function monthIncomeFor(date){
  return txForMonth(date).filter(function(t){ return Number(t.amount) > 0; })
    .reduce(function(s,t){ return s + Number(t.amount); }, 0);
}
function categorySpendFor(category, date){
  return txForMonth(date).filter(function(t){ return t.category === category && Number(t.amount) < 0; })
    .reduce(function(s,t){ return s + Math.abs(Number(t.amount)); }, 0);
}

function progressBar(pct, over){
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="budget-bar"><div class="budget-bar-fill${over?' over':''}" style="width:${clamped}%"></div></div>`;
}

// Compact dashboard card
function monthlyBudgetSummaryHTML(){
  const now = new Date();
  const target = totalExpenseBudget();
  const spent = monthSpendFor(now);
  const pct = target > 0 ? Math.round((spent/target)*100) : 0;
  const over = target > 0 && spent > target;
  const diff = Math.abs(spent - target);

  return `
    <div class="chart-card clickable-card" style="grid-column:1 / -1;" onclick="openBudgetDetail()">
      <div class="chart-title-row">
        <div class="chart-title">Monthly Budget</div>
        <span class="chevron">›</span>
      </div>
      ${target > 0 ? `
        <div class="budget-headline">
          <span class="budget-headline-num ${over?'over':''}">${fmtShort(diff)}</span>
          <span class="budget-headline-sub">${over?'overspent':'available'}</span>
          <span class="budget-headline-target">${fmtShort(spent)} / ${fmtShort(target)}</span>
        </div>
        ${progressBar(pct, over)}
        ${over ? '<div class="budget-warning">⚠ Total budget overspent</div>' : ''}
      ` : `<div class="empty-note">No budget set yet — tap to set monthly limits per category.</div>`}
    </div>`;
}

function budgetDetailScreenHTML(){
  const m = budgetViewMonth;
  const monthLabel = m.toLocaleString(undefined, { month:'long', year:'numeric' });
  const spent = monthSpendFor(m);
  const income = monthIncomeFor(m);
  const expenseTarget = totalExpenseBudget();
  const incomeTarget = Number(budgets.incomeTarget || 0);
  const profit = income - spent;
  const profitTarget = incomeTarget - expenseTarget;

  const incomePct = incomeTarget > 0 ? Math.round((income/incomeTarget)*100) : 0;
  const expensePct = expenseTarget > 0 ? Math.round((spent/expenseTarget)*100) : 0;
  const expenseOver = expenseTarget > 0 && spent > expenseTarget;

function trendSVG(){
  // Simple running-balance line over the last 30 days of transactions (relative change), since we don't store daily net-worth snapshots yet.
  const days = 30;
  const now = new Date();
  const start = new Date(now); start.setDate(start.getDate() - days);
  const daily = new Array(days+1).fill(0);
  transactions.forEach(function(t){
    const d = new Date(t.occurred_at);
    const idx = Math.floor((d - start) / (1000*60*60*24));
    if(idx >= 0 && idx <= days) daily[idx] += Number(t.amount);
  });
  let running = 0;
  const points = daily.map(function(v, i){
    running += v;
    const x = (i/days) * 480;
    return { x: x, y: running };
  });
  const ys = points.map(function(p){ return p.y; });
  const minY = Math.min.apply(null, ys.concat([0])), maxY = Math.max.apply(null, ys.concat([1]));
  const range = (maxY - minY) || 1;
  const toY = function(y){ return 140 - ((y - minY) / range) * 120; };
  const path = points.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + toY(p.y).toFixed(1); }).join(' ');
  const areaPath = path + ` L480,150 L0,150 Z`;
  return `
    <svg width="100%" height="150" viewBox="0 0 480 150" preserveAspectRatio="none">
      <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaPath}" fill="url(#areaFill)"/>
      <path d="${path}" fill="none" stroke="#9DB8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

// Robust-ish CSV parser: handles quoted fields, embedded commas, and "" escaped quotes.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(v){ return v.trim() !== ''; }); });
}

function parseAmount(str){
  if(str === undefined || str === null) return NaN;
  const cleaned = String(str).replace(/[^0-9.\-]/g, '');
  if(cleaned === '' || cleaned === '-') return NaN;
  return parseFloat(cleaned);
}

// Accepts DD.MM.YYYY, DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD, YYYY/MM/DD -> returns 'YYYY-MM-DD' or null
function parseFlexibleDate(str){
  if(!str) return null;
  const s = str.trim();
  let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){
    return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  }
  if((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))){
    // DD.MM.YYYY (European style)
    return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  }
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){
    const a = parseInt(m[1],10), b = parseInt(m[2],10);
    if(a > 12) return m[3] + '-' + pad(b) + '-' + pad(a); // must be DD/MM/YYYY
    return m[3] + '-' + pad(a) + '-' + pad(b); // assume MM/DD/YYYY
  }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}
function pad(n){ n = String(n); return n.length < 2 ? '0'+n : n; }

const CATEGORY_ALIASES = {
  'heath':'Health', 'tax':'Taxes', 'subscription':'Digital / Subscriptions',
  'subscriptions':'Digital / Subscriptions', 'grocery':'Groceries', 'restaurant':'Eating out',
  'dining':'Eating out', 'utilities':'Bills', 'utility':'Bills', 'salary':'Salary',
  'wage':'Salary', 'wages':'Salary'
};

function matchCategory(raw, type){
  if(!raw) return null;
  const clean = raw.trim().toLowerCase();
  const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  const exact = list.find(function(c){ return c.toLowerCase() === clean; });
  if(exact) return exact;
  if(CATEGORY_ALIASES[clean]){
    const alias = CATEGORY_ALIASES[clean];
    if(list.indexOf(alias) !== -1) return alias;
  }
  return null;
}

function findHeader(headers, patterns){
  for(let i = 0; i < headers.length; i++){
    const h = headers[i].toLowerCase();
    if(patterns.some(function(p){ return p.test(h); })) return i;
  }
  return -1;
}

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      importFromCSVText(e.target.result);
    }catch(err){
      alert('Could not read that file: ' + (err && err.message ? err.message : err));
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function importFromCSVText(text){
  const rows = parseCSV(text);
  if(rows.length < 2){ alert('No data rows found in that file.'); return; }

  const headers = rows[0];
  const idxDate = findHeader(headers, [/date/]);
  const idxDesc = findHeader(headers, [/description/, /^name$/, /payee/, /merchant/, /memo/]);
  const idxCategory = findHeader(headers, [/^category$/]);
  const idxOutgoing = findHeader(headers, [/outgoing/, /debit/, /expense/, /withdrawal/]);
  const idxIncome = findHeader(headers, [/income/, /credit/, /deposit/]);
  const idxAmount = findHeader(headers, [/^amount$/]);
  const idxType = findHeader(headers, [/^type$/]);

  if(idxDate === -1 || (idxOutgoing === -1 && idxIncome === -1 && idxAmount === -1)){
    alert("Couldn't find recognizable Date and Amount columns in this file. Expected something like Date + Amount, or Date + Outgoing/Income.");
    return;
  }

  let imported = 0, skipped = 0;

  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    if(!row || !row.length) { continue; }

    const dateStr = idxDate !== -1 ? row[idxDate] : '';
    const occurred_at = parseFlexibleDate(dateStr);

    let amount = NaN;
    let inferredType = null;

    if(idxOutgoing !== -1 && row[idxOutgoing] && row[idxOutgoing].trim() !== ''){
      amount = -Math.abs(parseAmount(row[idxOutgoing]));
      inferredType = 'expense';
    } else if(idxIncome !== -1 && row[idxIncome] && row[idxIncome].trim() !== ''){
      amount = Math.abs(parseAmount(row[idxIncome]));
      inferredType = 'income';
    } else if(idxAmount !== -1){
      const raw = parseAmount(row[idxAmount]);
      if(!isNaN(raw)){
        amount = raw;
        inferredType = raw >= 0 ? 'income' : 'expense';
      }
    }

    if(idxType !== -1 && row[idxType]){
      const t = row[idxType].trim().toLowerCase();
      if(t.indexOf('income') !== -1 || t.indexOf('credit') !== -1) inferredType = 'income';
      else if(t.indexOf('expense') !== -1 || t.indexOf('debit') !== -1) inferredType = 'expense';
    }

    if(!occurred_at || isNaN(amount) || amount === 0){ skipped++; continue; }

    const rawDesc = idxDesc !== -1 ? (row[idxDesc] || '').trim() : '';
    const rawCategory = idxCategory !== -1 ? (row[idxCategory] || '').trim() : rawDesc;

    let category = matchCategory(rawCategory, inferredType);
    if(!category) category = inferredType === 'income' ? 'Other income' : 'Other expense';

    const name = rawDesc || rawCategory || (inferredType === 'income' ? 'Imported income' : 'Imported expense');

    transactions.unshift({ id: 't' + (nextId++), name: name, category: category, amount: amount, occurred_at: occurred_at });
    imported++;
  }

  persist();
  renderView('finance');
  alert('Imported ' + imported + ' transaction' + (imported===1?'':'s') + (skipped ? (', skipped ' + skipped + ' row' + (skipped===1?'':'s') + " that didn't look like valid transactions.") : '.'));
}

function exportCSV(){
  const header = ['Date','Name','Category','Type','Amount'];
  const lines = [header.join(',')];
  transactions.forEach(function(t){
    const type = Number(t.amount) > 0 ? 'Income' : 'Expense';
    const amt = Math.abs(Number(t.amount)).toFixed(2);
    const safe = function(v){
      v = String(v == null ? '' : v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    };
    lines.push([safe(t.occurred_at), safe(t.name), safe(t.category), type, amt].join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nova-export-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Ask Nova: real mic input (Web Speech API) + real answers from your data + TTS ---------- */
function pickBestVoice(voices){
  if(!voices || !voices.length) return null;
  const priorityNames = ['Google US English','Microsoft Aria Online (Natural)','Microsoft Jenny Online (Natural)','Microsoft Guy Online (Natural)','Samantha','Ava','Serena','Nicky','Karen'];
  for(const name of priorityNames){ const v = voices.find(function(v){ return v.name.indexOf(name)!==-1; }); if(v) return v; }
  const en = voices.filter(function(v){ return v.lang && v.lang.indexOf('en')===0; });
  const enh = en.find(function(v){ return /natural|enhanced|premium|neural/i.test(v.name); });
  if(enh) return enh;
  const nonLocal = en.find(function(v){ return v.localService === false; });
  if(nonLocal) return nonLocal;
  return en[0] || voices[0];
}
let cachedVoices = [];
if('speechSynthesis' in window){
  cachedVoices = window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function(){ cachedVoices = window.speechSynthesis.getVoices(); };
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const best = pickBestVoice(cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices());
  if(best) utter.voice = best;
  utter.rate = 0.97; utter.pitch = 1.02;
  window.speechSynthesis.speak(utter);
  return utter;
}

function answerQuery(q){
  const query = q.toLowerCase();
  const categories = Object.keys(CATEGORY_ICON);
  const matchedCat = categories.find(function(c){ return query.indexOf(c.toLowerCase()) !== -1; });

  if(matchedCat){
    const total = thisMonthTx().filter(function(t){ return t.category === matchedCat && Number(t.amount) < 0; })
      .reduce(function(s,t){ return s + Math.abs(Number(t.amount)); }, 0);
    return `You've spent ${fmt(total)} on ${matchedCat.toLowerCase()} this month.`;
  }
  if(query.indexOf('net worth') !== -1){
    return `Your net worth is ${fmt(netWorth())}.`;
  }
  if(query.indexOf('income') !== -1 || query.indexOf('earn') !== -1){
    return `You've earned ${fmt(monthIncome())} this month.`;
  }
  if(query.indexOf('spend') !== -1 || query.indexOf('spent') !== -1){
    return `You've spent ${fmt(monthSpend())} in total this month.`;
  }
  if(query.indexOf('saving') !== -1){
    const r = savingsRate();
    return r===null ? `I don't have enough income data yet to figure out your savings rate.` : `Your savings rate this month is ${r}%.`;
  }
  return `I can answer questions about net worth, income, spending, savings rate, or spending by category — try asking one of those.`;
}

function wireNova(){
  const bar = document.getElementById('novaBar');
  const orbWrap = document.getElementById('novaOrb');
  const ph = document.getElementById('novaPh');
  const dim = document.getElementById('mainDim');
  if(!bar || !orbWrap) return;

  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let running = false;

  function setState(s){ bar.setAttribute('data-state', s); }
  function reset(){
    setState('idle'); ph.classList.remove('shimmer'); ph.textContent = 'Ask Nova anything…';
    if(dim) dim.classList.remove('on'); running = false;
  }

  orbWrap.addEventListener('click', function(){
    if(running) return;
    running = true;
    if(dim) dim.classList.add('on');

    if(!SpeechRecognitionCtor){
      ph.textContent = 'Voice input isn\'t supported in this browser — try Chrome or Safari.';
      setTimeout(reset, 2500);
      return;
    }

    setState('listening');
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event){
      const transcript = event.results[0][0].transcript;
      setState('query');
      ph.textContent = '"' + transcript + '"';

      setTimeout(function(){
        setState('thinking');
        ph.classList.add('shimmer');
        ph.textContent = 'Nova is thinking…';

        setTimeout(function(){
          setState('speaking');
          ph.classList.remove('shimmer');
          const answer = answerQuery(transcript);
          ph.textContent = answer;
          const utter = speak(answer);
          if(utter){
            utter.onend = reset;
            utter.onerror = reset;
            setTimeout(function(){ if(bar.getAttribute('data-state')==='speaking') reset(); }, 9000);
          } else {
            setTimeout(reset, 3500);
          }
        }, 900);
      }, 400);
    };

    recognition.onerror = function(){ reset(); };
    recognition.onend = function(){ if(bar.getAttribute('data-state')==='listening') reset(); };

    recognition.start();
  });
}

init();
</script>
</body>
</html>
